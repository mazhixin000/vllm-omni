# HunyuanImage-3.0-Instruct DiT-only deploy.
#
# Use this for standalone DiT/offline execution. This file resolves to one
# diffusion stage with stage_id 0 and does not depend on the AR stage.
pipeline: hunyuan_image3_dit
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enforce_eager: true
    devices: "0,1,2,3"
    # 当前 Distil 模型在 TP=1 下每卡复制完整权重会 OOM，使用已验证的 TP=4 + EP。
    additional_config:
      multistream_overlap_shared_expert: true
    vae_use_slicing: false
    # VAE patch parallel 依赖 tiling；显式开启，避免仅依赖运行时自动修正。
    vae_use_tiling: true
    cache_backend:
    cache_config:
    enable_cache_dit_summary: false
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      enable_expert_parallel: true
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      allgather_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 4
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
    default_sampling_params:
      seed: 42

platforms:
  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.65
        devices: "0,1,2,3"
        max_num_batched_tokens: 32768
        vae_use_tiling: true
        additional_config:
          multistream_overlap_shared_expert: true
          hunyuan_vit_bucket_pad: true
          hunyuan_vit_aclgraph: true
          hunyuan_vit_aclgraph_strict: false
          hunyuan_vit_aclgraph_lazy_capture: true
          hunyuan_vit_aclgraph_warmups: 3
          hunyuan_vit_aclgraph_max_graphs: 10
          hunyuan_vit_aclgraph_dedicated_stream: true
          hunyuan_vit_aclgraph_capture_layouts:
            - batch_size: 1
              max_patches: 1024
              spatial_shapes:
                - [42, 24]
            - batch_size: 1
              max_patches: 1024
              spatial_shapes:
                - [32, 24]
            - batch_size: 1
              max_patches: 1024
              spatial_shapes:
                - [24, 32]
        # platform overlay 会整体替换基础 parallel_config，因此需在此完整声明。
        parallel_config:
          pipeline_parallel_size: 1
          data_parallel_size: 1
          tensor_parallel_size: 4
          enable_expert_parallel: true
          sequence_parallel_size: 1
          ulysses_degree: 1
          ring_degree: 1
          allgather_degree: 1
          cfg_parallel_size: 1
          vae_patch_parallel_size: 4
          vae_parallel_mode: tile
          use_hsdp: false
          hsdp_shard_size: -1
          hsdp_replicate_size: 1

  xpu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.9
        devices: "0,1,2,3,4,5,6,7"
        quantization: fp8
        parallel_config:
          pipeline_parallel_size: 1
          data_parallel_size: 1
          tensor_parallel_size: 8
          enable_expert_parallel: true
          sequence_parallel_size: 1
          ulysses_degree: 1
          ring_degree: 1
          cfg_parallel_size: 1
          vae_patch_parallel_size: 1
          use_hsdp: false
          hsdp_shard_size: -1
          hsdp_replicate_size: 1
